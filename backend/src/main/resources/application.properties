spring.datasource.url=jdbc:h2:file:./data/onlinejudge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,file:../database/migrations/20260525_01_create_grd_grade_item.sql,classpath:h2-grd-analysis-source-fingerprint.sql,file:../database/migrations/DB-CRS-03-course-resource.sql,file:../database/migrations/20260525_02_create_lab_experiment.sql,classpath:h2-lab-published-at.sql,file:../database/migrations/20260526_01_create_lab_submission.sql,file:../database/migrations/20260822_02_create_lab_submission_source_file.sql,file:../database/migrations/20260604_01_create_lab_report.sql,file:../database/migrations/20260605_02_create_lab_score.sql,file:../database/migrations/20260601_01_create_lab_evaluation_result.sql,file:../database/migrations/20260601_02_create_lab_evaluation.sql,file:../database/migrations/20260530_01_create_hwk_homework.sql,file:../database/migrations/20260601_01_create_hwk_submission.sql,file:../database/migrations/20260822_03_create_hwk_submission_attachment.sql,classpath:h2-hwk-statistics-attention-indexes.sql,file:../database/migrations/20260602_01_create_hwk_evaluation.sql,file:../database/migrations/20260602_02_create_hwk_review_log.sql,file:../database/migrations/20260530_01_create_lrn_learning_task.sql,file:../database/migrations/20260531_01_create_lrn_learning_progress.sql,file:../database/migrations/20260602_01_create_lrn_learning_record.sql,file:../database/migrations/20260603_01_create_lrn_notification.sql,file:../database/migrations/20260605_01_create_lrn_reminder_rule.sql
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
onlinejudge.hwk.attachments.max-size-bytes=10485760
onlinejudge.hwk.attachments.upload-ttl=PT24H
onlinejudge.hwk.attachments.zip-max-entries=128
onlinejudge.hwk.attachments.cleanup-enabled=true
onlinejudge.auth.allow-header-auth=false
onlinejudge.notifications.internal-token=${ONLINEJUDGE_NOTIFICATIONS_INTERNAL_TOKEN:}
onlinejudge.storage.local-root=./data/uploads
onlinejudge.integration.course.timeout-ms=1000
onlinejudge.integration.course.max-pool-size=4
onlinejudge.integration.course.queue-capacity=64
onlinejudge.integration.grade.timeout-ms=1000
onlinejudge.integration.grade.max-pool-size=4
onlinejudge.integration.grade.queue-capacity=64
onlinejudge.evaluation.sandbox.mode=docker
onlinejudge.evaluation.docker.command=docker
onlinejudge.evaluation.docker.python-image=python:3.12-alpine
