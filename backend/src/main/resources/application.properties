spring.datasource.url=jdbc:h2:file:./data/onlinejudge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,file:../database/migrations/20260525_01_create_grd_grade_item.sql,file:../database/migrations/DB-CRS-03-course-resource.sql,file:../database/migrations/20260525_02_create_lab_experiment.sql,file:../database/migrations/20260526_01_create_lab_submission.sql,file:../database/migrations/20260601_01_create_lab_evaluation_result.sql,file:../database/migrations/20260601_02_create_lab_evaluation.sql,file:../database/migrations/20260530_01_create_hwk_homework.sql,file:../database/migrations/20260601_01_create_hwk_submission.sql,file:../database/migrations/20260602_01_create_hwk_evaluation.sql,file:../database/migrations/20260602_02_create_hwk_review_log.sql,file:../database/migrations/20260530_01_create_lrn_learning_task.sql,file:../database/migrations/20260531_01_create_lrn_learning_progress.sql,file:../database/migrations/20260602_01_create_lrn_learning_record.sql,file:../database/migrations/20260603_01_create_lrn_notification.sql
onlinejudge.auth.allow-header-auth=false
onlinejudge.notifications.internal-token=${ONLINEJUDGE_NOTIFICATIONS_INTERNAL_TOKEN:}
