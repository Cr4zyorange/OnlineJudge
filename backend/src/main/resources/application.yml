spring:
  datasource:
    url: jdbc:h2:mem:onlinejudge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations:
        - file:../database/migrations/20260525_01_create_grd_grade_item.sql
        - classpath:h2-grd-analysis-source-fingerprint.sql
        - file:../database/migrations/DB-CRS-03-course-resource.sql
        - file:../database/migrations/DB-CRS-05-course-announcement.sql
        - file:../database/migrations/20260525_02_create_lab_experiment.sql
        - file:../database/migrations/20260526_01_create_lab_submission.sql
        - file:../database/migrations/20260822_02_create_lab_submission_source_file.sql
        - file:../database/migrations/20260604_01_create_lab_report.sql
        - file:../database/migrations/20260605_02_create_lab_score.sql
        - file:../database/migrations/20260601_01_create_lab_evaluation_result.sql
        - file:../database/migrations/20260601_02_create_lab_evaluation.sql
        - file:../database/migrations/20260530_01_create_hwk_homework.sql
        - file:../database/migrations/20260601_01_create_hwk_submission.sql
        - file:../database/migrations/20260822_03_create_hwk_submission_attachment.sql
        - classpath:h2-hwk-statistics-attention-indexes.sql
        - file:../database/migrations/20260530_01_create_lrn_learning_task.sql
        - file:../database/migrations/20260531_01_create_lrn_learning_progress.sql

server:
  port: 8080

onlinejudge:
  auth:
    allow-header-auth: false
  identity:
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER:onlinejudge.identity.v2}
      audience: ${IDENTITY_JWT_AUDIENCE:onlinejudge.api}
    jwks:
      trust-bundle: ${IDENTITY_JWKS_TRUST_BUNDLE:}
      uri: ${IDENTITY_JWKS_URI:}
      refresh-interval: ${IDENTITY_JWKS_REFRESH_INTERVAL:PT5M}
      refresh-initial-delay: ${IDENTITY_JWKS_REFRESH_INITIAL_DELAY:PT30S}
      request-timeout: ${IDENTITY_JWKS_REQUEST_TIMEOUT:PT1S}
      refresh-request-id: ${IDENTITY_JWKS_REFRESH_REQUEST_ID:identity-jwks-refresh}
  hwk:
    attachments:
      max-size-bytes: 10485760
      upload-ttl: PT24H
      zip-max-entries: 128
      cleanup-enabled: true
