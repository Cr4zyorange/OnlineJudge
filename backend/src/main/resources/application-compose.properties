spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:onlinejudge}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:onlinejudge}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=60000
spring.sql.init.mode=never
onlinejudge.course.schema-initializer.enabled=false
onlinejudge.auth.allow-header-auth=false
onlinejudge.notifications.internal-token=${ONLINEJUDGE_NOTIFICATIONS_INTERNAL_TOKEN:}
onlinejudge.storage.local-root=/opt/onlinejudge/data/uploads
onlinejudge.demo-data.enabled=${ONLINEJUDGE_DEMO_DATA_ENABLED:true}
onlinejudge.evaluation.sandbox.mode=${ONLINEJUDGE_EVALUATION_SANDBOX_MODE:fake}
onlinejudge.evaluation.docker.command=${ONLINEJUDGE_EVALUATION_DOCKER_COMMAND:docker}
onlinejudge.evaluation.docker.python-image=${ONLINEJUDGE_EVALUATION_DOCKER_PYTHON_IMAGE:python:3.12-alpine}
onlinejudge.reliability.rabbitmq.enabled=${ONLINEJUDGE_RELIABILITY_RABBITMQ_ENABLED:true}
onlinejudge.reliability.publisher.enabled=${ONLINEJUDGE_RELIABILITY_PUBLISHER_ENABLED:true}
