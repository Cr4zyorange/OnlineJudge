# EXAMPLE ONLY - never applied by any script and never holding real values.
# Key names are frozen by the D3 contract #293 section 4.2. The deploy script
# (scripts/kind/k8s-deploy.sh) generates the real Secret at deploy time from
# the MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD / (optional)
# ONLINEJUDGE_NOTIFICATIONS_INTERNAL_TOKEN environment values supplied by the
# operator or GitHub Secrets. Committing real secret values is forbidden.
apiVersion: v1
kind: Secret
metadata:
  name: onlinejudge-secrets
  namespace: onlinejudge-ci
type: Opaque
stringData:
  MYSQL_PASSWORD: "REQUIRED-FROM-DEPLOY-ENVIRONMENT"
  MYSQL_ROOT_PASSWORD: "REQUIRED-FROM-DEPLOY-ENVIRONMENT"
  ONLINEJUDGE_NOTIFICATIONS_INTERNAL_TOKEN: "REQUIRED-FROM-DEPLOY-ENVIRONMENT"
