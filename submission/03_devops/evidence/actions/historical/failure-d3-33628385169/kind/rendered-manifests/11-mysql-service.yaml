# Headless governing Service for the mysql StatefulSet (D3 contract #293
# section 2: mysql stays cluster-internal, container port 3306).
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: onlinejudge-ci
  labels:
    app: mysql
    app.kubernetes.io/part-of: onlinejudge
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      name: mysql
      targetPort: mysql
