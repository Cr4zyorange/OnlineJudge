apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-runtime-account-init
  namespace: onlinejudge-platform
  annotations:
    delivery.onlinejudge.io/prerequisite: mysql-ready
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-runtime-account-init
          image: mysql:8.4
          command: ["sh", "-ec", "export MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\"\nescaped_password=$(printf '%s' \"${IDENTITY_DATABASE_PASSWORD}\" | sed -e 's/\\\\/\\\\\\\\/g' -e \"s/'/''/g\")\nmysql --protocol=tcp --host=mysql --port=3306 --user=root --execute \"CREATE DATABASE IF NOT EXISTS oj_identity CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'oj_identity_rw'@'%' IDENTIFIED BY '$escaped_password'; ALTER USER 'oj_identity_rw'@'%' IDENTIFIED BY '$escaped_password'; REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'oj_identity_rw'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON oj_identity.* TO 'oj_identity_rw'@'%';\"\nescaped_password=$(printf '%s' \"${COURSE_DATABASE_PASSWORD}\" | sed -e 's/\\\\/\\\\\\\\/g' -e \"s/'/''/g\")\nmysql --protocol=tcp --host=mysql --port=3306 --user=root --execute \"CREATE DATABASE IF NOT EXISTS oj_course CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'oj_course_rw'@'%' IDENTIFIED BY '$escaped_password'; ALTER USER 'oj_course_rw'@'%' IDENTIFIED BY '$escaped_password'; REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'oj_course_rw'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON oj_course.* TO 'oj_course_rw'@'%';\"\nescaped_password=$(printf '%s' \"${ASSESSMENT_DATABASE_PASSWORD}\" | sed -e 's/\\\\/\\\\\\\\/g' -e \"s/'/''/g\")\nmysql --protocol=tcp --host=mysql --port=3306 --user=root --execute \"CREATE DATABASE IF NOT EXISTS oj_assessment CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'oj_assessment_rw'@'%' IDENTIFIED BY '$escaped_password'; ALTER USER 'oj_assessment_rw'@'%' IDENTIFIED BY '$escaped_password'; REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'oj_assessment_rw'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON oj_assessment.* TO 'oj_assessment_rw'@'%';\"\nescaped_password=$(printf '%s' \"${GRADE_DATABASE_PASSWORD}\" | sed -e 's/\\\\/\\\\\\\\/g' -e \"s/'/''/g\")\nmysql --protocol=tcp --host=mysql --port=3306 --user=root --execute \"CREATE DATABASE IF NOT EXISTS oj_grade CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS 'oj_grade_rw'@'%' IDENTIFIED BY '$escaped_password'; ALTER USER 'oj_grade_rw'@'%' IDENTIFIED BY '$escaped_password'; REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'oj_grade_rw'@'%'; GRANT SELECT, INSERT, UPDATE, DELETE ON oj_grade.* TO 'oj_grade_rw'@'%';\"\nmysql --protocol=tcp --host=mysql --port=3306 --user=root --execute \"FLUSH PRIVILEGES;\""]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onlinejudge-platform-runtime
                  key: MYSQL_ROOT_PASSWORD
            - name: IDENTITY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onlinejudge-platform-runtime
                  key: IDENTITY_DATABASE_PASSWORD
            - name: COURSE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onlinejudge-platform-runtime
                  key: COURSE_DATABASE_PASSWORD
            - name: ASSESSMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onlinejudge-platform-runtime
                  key: ASSESSMENT_DATABASE_PASSWORD
            - name: GRADE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onlinejudge-platform-runtime
                  key: GRADE_DATABASE_PASSWORD
---
