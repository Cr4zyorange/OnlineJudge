# Inventory only: deploy with scripts/platform/deploy_kubernetes_disposable_environment.sh.
# Kubernetes does not treat YAML document order as a dependency graph.
apiVersion: v1
kind: Namespace
metadata:
  name: onlinejudge-platform
  labels:
    app.kubernetes.io/part-of: onlinejudge-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-proxy-config
  namespace: onlinejudge-platform
  labels:
    app.kubernetes.io/part-of: onlinejudge-platform
data:
  frontend-disposable.conf: |
    # This file is rendered only for the disposable #318 topology.  The shared
    # frontend image keeps its monolith-development `backend` upstream, while the
    # platform routes browser API traffic through the gateway service.  The
    # renderer supplies the target platform's DNS resolver and keeps gateway lookup
    # at request time so frontend can start
    # before the gateway workload becomes Ready.
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 55m;

        resolver kube-dns.kube-system.svc.cluster.local ipv6=off valid=10s;
        set $gateway_upstream gateway:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 = @gateway_bad_gateway;
        error_page 504 = @gateway_gateway_timeout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-User-Id "";
        proxy_set_header X-Username "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Permissions "";
        proxy_set_header X-Course-Ids "";
        proxy_set_header X-Manageable-Course-Ids "";

        location ~ ^/api/v1/courses/[0-9]+/(labs|homeworks)(/|$) {
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://$gateway_upstream;
        }

        location ~ ^/api/v1/courses/[0-9]+/(grades|grade-items|grade-rules|grade-publish-records|grade-change-logs|my-grades|grade-analysis|grade-review-requests|my-grade-review-requests)(/|$) {
            proxy_pass http://$gateway_upstream;
        }

        location ^~ /api/v1/auth/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/users/me { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/admin/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/labs/ { proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://$gateway_upstream; }
        location = /api/v1/homeworks { proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/homeworks/ { proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/submissions/ { proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/evaluations/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/learning/ { proxy_pass http://$gateway_upstream; }
        location = /api/v1/notifications { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/notifications/ { proxy_pass http://$gateway_upstream; }
        location = /api/v1/reminder-rules { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/reminder-rules/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/grade-items/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/grade-records/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/course-grade-summaries/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/grade-review-requests/ { proxy_pass http://$gateway_upstream; }
        location ^~ /api/v1/chapters/ { proxy_pass http://$gateway_upstream; }
        location = /api/v1/courses { proxy_pass http://$gateway_upstream; }
        location /api/v1/courses/ { proxy_pass http://$gateway_upstream; }
        location /api/ { proxy_pass http://$gateway_upstream; }

        location / {
            try_files $uri /index.html;
        }

        location @gateway_bad_gateway {
            default_type application/json;
            return 502 '{"code":"GATEWAY_502","message":"下游服务暂不可用","data":null}';
        }

        location @gateway_gateway_timeout {
            default_type application/json;
            return 504 '{"code":"GATEWAY_504","message":"下游服务响应超时","data":null}';
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: onlinejudge-platform
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: onlinejudge-platform
    app.kubernetes.io/version: c66686ff0e011f5ee63e3908683f01afd4f83ebc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      containers:
        - name: gateway
          image: onlinejudge/gateway:c66686ff0e011f5ee63e3908683f01afd4f83ebc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASSESSMENT_UPSTREAM
              value: "assessment-api:8083"
            - name: COURSE_UPSTREAM
              value: "course-service:8082"
            - name: GATEWAY_SERVICE_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: onlinejudge-platform-runtime
                  key: GATEWAY_SERVICE_IDENTITY
            - name: GIT_SHA
              value: "c66686ff0e011f5ee63e3908683f01afd4f83ebc"
            - name: GRADE_UPSTREAM
              value: "grade-service:8084"
            - name: IDENTITY_JWKS_TRUST_BUNDLE
              valueFrom:
                secretKeyRef:
                  name: onlinejudge-platform-runtime
                  key: IDENTITY_JWKS_TRUST_BUNDLE
                  optional: true
            - name: IDENTITY_JWT_AUDIENCE
              value: "onlinejudge.api"
            - name: IDENTITY_JWT_ISSUER
              value: "onlinejudge.identity.v2"
            - name: IDENTITY_UPSTREAM
              value: "identity-service:8081"
            - name: ISSUE318_FAIL_READINESS
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
---
