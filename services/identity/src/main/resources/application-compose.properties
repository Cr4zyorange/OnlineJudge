spring.datasource.url=jdbc:mysql://${IDENTITY_DATABASE_HOST:identity-db}:${IDENTITY_DATABASE_PORT:3306}/${IDENTITY_DATABASE_NAME:onlinejudge_identity}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${IDENTITY_DATABASE_USERNAME:onlinejudge_identity}
spring.datasource.password=${IDENTITY_DATABASE_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=60000
spring.sql.init.mode=never
onlinejudge.auth.seed-data-enabled=${IDENTITY_SEED_DATA_ENABLED:false}
onlinejudge.build.version=${IDENTITY_SERVICE_VERSION:0.1.0-SNAPSHOT}
onlinejudge.build.revision=${IDENTITY_SERVICE_REVISION:unknown}
onlinejudge.identity.jwt.allow-ephemeral-keys=false
server.port=8081
