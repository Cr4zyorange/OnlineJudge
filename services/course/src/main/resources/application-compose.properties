spring.datasource.url=jdbc:mysql://${COURSE_DATABASE_HOST:mysql}:${COURSE_DATABASE_PORT:3306}/${COURSE_DATABASE_NAME:oj_course}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${COURSE_DATABASE_USER:oj_course_rw}
spring.datasource.password=${COURSE_DATABASE_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=60000
spring.sql.init.mode=never
server.port=8082
