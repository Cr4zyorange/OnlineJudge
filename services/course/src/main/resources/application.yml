spring:
  application:
    name: course-service
  datasource:
    url: ${COURSE_DATASOURCE_URL:jdbc:h2:mem:course_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${COURSE_DATABASE_USER:sa}
    password: ${COURSE_DATABASE_PASSWORD:}
    driver-class-name: ${COURSE_DATABASE_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-course.sql,classpath:schema-course-event-inbox.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${COURSE_HTTP_PORT:8082}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

course:
  identity:
    issuer: ${IDENTITY_JWT_ISSUER:onlinejudge.identity.v2}
    audience: ${IDENTITY_JWT_AUDIENCE:onlinejudge.api}
    jwks-uri: ${IDENTITY_JWKS_URI:}
    jwks-trust-bundle: ${IDENTITY_JWKS_TRUST_BUNDLE:}
    request-timeout: ${IDENTITY_JWKS_REQUEST_TIMEOUT:PT1S}
    refresh-enabled: ${IDENTITY_JWKS_REFRESH_ENABLED:true}
    refresh-initial-delay: ${IDENTITY_JWKS_REFRESH_INITIAL_DELAY:PT30S}
    refresh-interval: ${IDENTITY_JWKS_REFRESH_INTERVAL:PT5M}
    mtls-service-subjects: ${COURSE_INTERNAL_MTLS_SERVICE_SUBJECTS:}
  rabbit:
    enabled: ${COURSE_RABBIT_ENABLED:false}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:oj_course_events}
    password: ${RABBITMQ_PASSWORD:}
    exchange: ${RABBITMQ_EXCHANGE:onlinejudge.events.v2}
    identity-security-version-queue: ${COURSE_IDENTITY_SECURITY_VERSION_QUEUE:course.identity-security-version.v2}
  learning:
    base-url: ${COURSE_LEARNING_BASE_URL:}
    timeout-ms: ${COURSE_LEARNING_TIMEOUT_MS:800}
    service-token: ${COURSE_LEARNING_SERVICE_TOKEN:}
    mtls-enabled: ${COURSE_LEARNING_MTLS_ENABLED:false}
    mtls-keystore-path: ${COURSE_LEARNING_MTLS_KEYSTORE_PATH:}
    mtls-keystore-password: ${COURSE_LEARNING_MTLS_KEYSTORE_PASSWORD:}
    mtls-keystore-type: ${COURSE_LEARNING_MTLS_KEYSTORE_TYPE:PKCS12}
    mtls-truststore-path: ${COURSE_LEARNING_MTLS_TRUSTSTORE_PATH:}
    mtls-truststore-password: ${COURSE_LEARNING_MTLS_TRUSTSTORE_PASSWORD:}
    mtls-truststore-type: ${COURSE_LEARNING_MTLS_TRUSTSTORE_TYPE:PKCS12}
  storage:
    root: ${COURSE_STORAGE_ROOT:${java.io.tmpdir}/onlinejudge-course}
