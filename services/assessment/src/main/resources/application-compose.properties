spring.datasource.url=jdbc:mysql://${ASSESSMENT_DATABASE_HOST:assessment-db}:${ASSESSMENT_DATABASE_PORT:3306}/${ASSESSMENT_DATABASE_NAME:oj_assessment}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${ASSESSMENT_DATABASE_USER:onlinejudge_assessment}
spring.datasource.password=${ASSESSMENT_DATABASE_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=60000
# DDL belongs exclusively to the migration control-plane Job.  Runtime API and
# worker accounts have DML-only grants and must never create a schema at boot.
spring.sql.init.mode=never
server.port=8083
