<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">OnlineJudge deployment topology</title>
  <desc id="desc">Browser traffic reaches the frontend Nginx container, which serves static files and proxies API traffic to the Spring Boot backend. The backend uses MySQL and an application data volume. Enhanced evaluation can reach the host Docker daemon through an optional socket mount.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .service { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .data { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .optional { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 7 5; rx: 8; }
      .title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .text { font: 500 15px Arial, sans-serif; fill: #1e293b; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .line { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="980" height="420"/>
  <text class="title" x="40" y="42">OnlineJudge Docker Compose topology</text>

  <rect class="panel" x="30" y="70" width="920" height="300"/>
  <text class="small" x="52" y="96">Host machine / Docker network: onlinejudge</text>

  <rect class="service" x="60" y="155" width="145" height="76"/>
  <text class="text" x="91" y="188">Browser</text>
  <text class="small" x="82" y="210">127.0.0.1:8088</text>

  <rect class="service" x="270" y="135" width="170" height="116"/>
  <text class="text" x="316" y="166">frontend</text>
  <text class="small" x="302" y="189">Nginx + static UI</text>
  <text class="small" x="300" y="211">/api proxy</text>
  <text class="small" x="299" y="233">client_max_body_size 55m</text>

  <rect class="service" x="510" y="135" width="170" height="116"/>
  <text class="text" x="558" y="166">backend</text>
  <text class="small" x="546" y="189">Spring Boot :8080</text>
  <text class="small" x="538" y="211">multipart 50MB / 55MB</text>
  <text class="small" x="543" y="233">fake evaluation by default</text>

  <rect class="data" x="750" y="105" width="150" height="86"/>
  <text class="text" x="807" y="139">mysql</text>
  <text class="small" x="781" y="163">MySQL 8.4</text>

  <rect class="data" x="750" y="230" width="150" height="86"/>
  <text class="text" x="785" y="264">app-data</text>
  <text class="small" x="776" y="288">uploaded files</text>

  <rect class="optional" x="510" y="285" width="170" height="58"/>
  <text class="text" x="533" y="316">Docker daemon</text>
  <text class="small" x="534" y="336">enhanced eval only</text>

  <path class="line" d="M 205 193 H 270"/>
  <text class="small" x="219" y="181">HTTP</text>

  <path class="line" d="M 440 193 H 510"/>
  <text class="small" x="456" y="181">/api</text>

  <path class="line" d="M 680 160 H 750"/>
  <text class="small" x="694" y="148">JDBC</text>

  <path class="muted" d="M 680 224 C 705 242, 720 258, 750 273"/>
  <text class="small" x="696" y="244">files</text>

  <path class="muted" d="M 595 251 V 285"/>
  <text class="small" x="609" y="272">optional</text>
</svg>
