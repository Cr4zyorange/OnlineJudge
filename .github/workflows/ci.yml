name: ci-quality-gate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OJ_CI_JAVA_MAJOR: "21"
  OJ_CI_NODE_MAJOR: "22"
  OJ_CI_NPM_VERSION: "10.9.2"
  OJ_CI_MAVEN_MIN_VERSION: "3.9.0"

jobs:
  validate-workflows:
    name: Validate workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect environment manifest
        run: bash scripts/ci/collect-environment.sh "$GITHUB_WORKSPACE" ci-artifacts/validate-workflows/environment.json
      - name: Static workflow checks
        run: bash scripts/ci/check-workflows.sh "$GITHUB_WORKSPACE"
      - name: Gate chain dry-run (all pass)
        run: bash scripts/ci/verify-gate-chain.sh --checkout "$GITHUB_WORKSPACE" --dry-run
      - name: Gate chain dry-run (failure must skip delivery)
        run: |
          set +e
          bash scripts/ci/verify-gate-chain.sh --checkout "$GITHUB_WORKSPACE" --dry-run --fail-job backend-gate
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "expected the injected failure to fail the chain"
            exit 1
          fi
          echo "injected failure correctly failed the chain"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-validate-workflows-${{ github.run_id }}
          path: ci-artifacts/validate-workflows/**
          if-no-files-found: warn
          retention-days: 14

  backend-gate:
    name: Backend compile + unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-workflows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            services/assessment/pom.xml
            services/course/pom.xml
            services/grade/pom.xml
      - name: Collect environment manifest
        run: bash scripts/ci/collect-environment.sh "$GITHUB_WORKSPACE" ci-artifacts/backend-gate/environment.json
      - name: Backend quality gates
        run: bash scripts/ci/backend-verify.sh "$GITHUB_WORKSPACE"
      - name: Summarize backend tests
        if: always()
        run: bash scripts/ci/summarize-tests.sh "$GITHUB_WORKSPACE" ci-artifacts/backend-gate
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-backend-gate-${{ github.run_id }}
          path: |
            ci-artifacts/backend-gate/**
            backend/target/surefire-reports/unit/**
            backend/target/surefire-reports/integration/**
            services/assessment/target/surefire-reports/**
            services/course/target/surefire-reports/**
            services/grade/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  frontend-gate:
    name: Frontend typecheck + unit + build + runner contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate-workflows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Collect environment manifest
        run: bash scripts/ci/collect-environment.sh "$GITHUB_WORKSPACE" ci-artifacts/frontend-gate/environment.json
      - name: Frontend quality gates
        run: bash scripts/ci/frontend-verify.sh "$GITHUB_WORKSPACE"
      - name: Summarize frontend tests
        if: always()
        run: bash scripts/ci/summarize-tests.sh "$GITHUB_WORKSPACE" ci-artifacts/frontend-gate
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-frontend-gate-${{ github.run_id }}
          path: |
            ci-artifacts/frontend-gate/**
            frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14

  contracts-gate:
    name: Repo contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate-workflows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up Node 22 for v2 contract definitions
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install zsh for macOS README replay regression
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Collect environment manifest
        run: bash scripts/ci/collect-environment.sh "$GITHUB_WORKSPACE" ci-artifacts/contracts-gate/environment.json
      - name: Repository contract gates (consumer side)
        run: bash scripts/ci/contract-verify.sh "$GITHUB_WORKSPACE" consumer
      - name: Repository contract gates (producer side)
        run: bash scripts/ci/contract-verify.sh "$GITHUB_WORKSPACE" producer
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-contracts-gate-${{ github.run_id }}
          path: |
            ci-artifacts/contracts-gate/**
            backend/target/surefire-reports/contract/**
            backend/target/surefire-reports/contract-consumer/**
            backend/target/surefire-reports/contract-producer/**
          if-no-files-found: warn
          retention-days: 14

  browser-e2e-gate:
    name: Browser business E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [validate-workflows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Collect environment manifest
        run: bash scripts/ci/collect-environment.sh "$GITHUB_WORKSPACE" ci-artifacts/browser-e2e-gate/environment.json
      - name: Install Docker Scout 1.24.0
        env:
          DOCKER_SCOUT_ARCHIVE: docker-scout_1.24.0_linux_amd64.tar.gz
          DOCKER_SCOUT_RELEASE: v1.24.0
          DOCKER_SCOUT_SHA256: f4e2814bd61040365153d5b964b144cb2dc6ee536a68b5bac4cadf00fc0ec34b
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/$DOCKER_SCOUT_ARCHIVE"
          curl --fail --location --retry 3 --retry-all-errors --output "$archive" \
            "https://github.com/docker/scout-cli/releases/download/$DOCKER_SCOUT_RELEASE/$DOCKER_SCOUT_ARCHIVE"
          printf '%s  %s\n' "$DOCKER_SCOUT_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$HOME/.docker/cli-plugins"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version
      - name: Browser business E2E quality gate
        run: bash scripts/ci/browser-e2e-verify.sh "$GITHUB_WORKSPACE"
      - name: Summarize browser E2E tests
        if: always()
        run: bash scripts/ci/summarize-tests.sh "$GITHUB_WORKSPACE" ci-artifacts/browser-e2e-gate
      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-browser-e2e-gate-${{ github.run_id }}
          path: |
            ci-artifacts/browser-e2e-gate/**
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: warn
          retention-days: 14

  # 后续镜像构建与 Kind 部署 job 必须以 needs: [delivery] 挂在本门禁之后；
  # delivery 只在前置质量门禁全部成功后执行，失败或取消时自动 skipped。
  delivery:
    name: Disposable delivery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [validate-workflows, backend-gate, frontend-gate, contracts-gate, browser-e2e-gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java 21 for immutable image builds
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            services/assessment/pom.xml
            services/course/pom.xml
            services/grade/pom.xml
      - name: Collect delivery manifest
        run: bash scripts/ci/collect-environment.sh "$GITHUB_WORKSPACE" ci-artifacts/delivery/environment.json
      - name: Delivery checkpoint
        run: bash scripts/ci/delivery-checkpoint.sh "$GITHUB_WORKSPACE"
      - name: Install Docker Scout 1.24.0
        env:
          DOCKER_SCOUT_ARCHIVE: docker-scout_1.24.0_linux_amd64.tar.gz
          DOCKER_SCOUT_RELEASE: v1.24.0
          DOCKER_SCOUT_SHA256: f4e2814bd61040365153d5b964b144cb2dc6ee536a68b5bac4cadf00fc0ec34b
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/$DOCKER_SCOUT_ARCHIVE"
          curl --fail --location --retry 3 --retry-all-errors --output "$archive" \
            "https://github.com/docker/scout-cli/releases/download/$DOCKER_SCOUT_RELEASE/$DOCKER_SCOUT_ARCHIVE"
          printf '%s  %s\n' "$DOCKER_SCOUT_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$HOME/.docker/cli-plugins"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version
      - name: Build affected artifacts and deploy the disposable environment
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/disposable-delivery.sh --checkout "$GITHUB_WORKSPACE"
      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-delivery-${{ github.run_id }}
          path: ci-artifacts/delivery/**
          if-no-files-found: warn
          retention-days: 14
