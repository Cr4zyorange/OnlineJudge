name: issue-340-resilience

on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/test/issue-340-resilience-matrix.json'
      - 'scripts/test/verify-issue-340-resilience.sh'
      - 'scripts/test/verify-issue-340-resilience.test.sh'
      - 'services/assessment/**'
      - 'services/course/**'
      - 'services/grade/**'
      - 'backend/src/main/java/com/onlinejudge/**'
      - 'backend/src/test/java/com/onlinejudge/**'
      - 'deploy/platform/**'
      - 'scripts/platform/**'
  workflow_dispatch:

concurrency:
  group: issue-340-resilience-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resilience-acceptance:
    name: "#340 seven-scenario resilience acceptance"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            services/assessment/pom.xml
            services/course/pom.xml
            services/grade/pom.xml
      - name: Validate matrix contract without Docker
        run: bash scripts/test/verify-issue-340-resilience.test.sh
      - name: Install checksum-verified Docker Scout for disposable images
        env:
          DOCKER_SCOUT_ARCHIVE: docker-scout_1.24.0_linux_amd64.tar.gz
          DOCKER_SCOUT_RELEASE: v1.24.0
          DOCKER_SCOUT_SHA256: f4e2814bd61040365153d5b964b144cb2dc6ee536a68b5bac4cadf00fc0ec34b
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/$DOCKER_SCOUT_ARCHIVE"
          curl --fail --location --retry 3 --retry-all-errors --output "$archive" \
            "https://github.com/docker/scout-cli/releases/download/$DOCKER_SCOUT_RELEASE/$DOCKER_SCOUT_ARCHIVE"
          printf '%s  %s\n' "$DOCKER_SCOUT_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$HOME/.docker/cli-plugins"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version
      - name: "Run real failure and recovery matrix in isolated #318 environment"
        run: bash scripts/test/verify-issue-340-resilience.sh --bootstrap-318 --output-dir ci-artifacts/issue-340
      - name: "Upload #340 evidence"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-340-resilience-${{ github.run_id }}
          path: ci-artifacts/issue-340/**
          if-no-files-found: warn
          retention-days: 14
