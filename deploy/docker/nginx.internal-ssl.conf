server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;

    # The supported Compose backend terminates TLS (server.ssl) so the
    # Course -> Learning internal hop can present mTLS client certificates.
    location /api/ {
        proxy_pass https://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dev-only self-signed backend certificate; production rotates a real CA.
        proxy_ssl_verify off;
    }

    location / {
        try_files $uri /index.html;
    }
}
