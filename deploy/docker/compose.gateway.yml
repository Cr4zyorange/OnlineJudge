services:
  frontend:
    ports: !reset []

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    image: onlinejudge/gateway:${GIT_SHA:?GIT_SHA must be the current full 40-character commit SHA}
    environment:
      IDENTITY_UPSTREAM: identity-service:8081
      COURSE_UPSTREAM: course-service:8082
      ASSESSMENT_UPSTREAM: assessment-api:8083
      GRADE_UPSTREAM: grade-service:8084
      LEARNING_UPSTREAM: learning-service:8085
    ports:
      - name: gateway-http
        target: 8080
        published: "${GATEWAY_HTTP_PORT:-8088}"
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
