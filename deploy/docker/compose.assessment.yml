name: onlinejudge-assessment
services:
  assessment-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: oj_assessment
      MYSQL_USER: onlinejudge_assessment
      MYSQL_PASSWORD: assessment-password
      MYSQL_ROOT_PASSWORD: root-password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${ASSESSMENT_RABBIT_USERNAME:?ASSESSMENT_RABBIT_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${ASSESSMENT_RABBIT_PASSWORD:?ASSESSMENT_RABBIT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 24
  # The only workload with the privileged host socket is this proxy.  The
  # assessment worker can create and remove isolated sandboxes over its private
  # Docker network, but cannot mount the socket or reach other API sections.
  assessment-sandbox-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1.2
    privileged: true
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_RESTARTS: "1"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      BUILD: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  assessment-sandbox-python-image-init:
    image: python:3.12-alpine
    network_mode: none
    command: ["python3", "-c", "pass"]
  assessment-sandbox-java-image-init:
    image: eclipse-temurin:21-jdk-alpine
    network_mode: none
    command: ["java", "-version"]
  assessment-sandbox-cpp-image-init:
    image: gcc:14.2.0
    network_mode: none
    command: ["g++", "--version"]
  assessment-storage-init:
    image: mysql:8.4
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /var/lib/onlinejudge-assessment && chown -R 10003:10003 /var/lib/onlinejudge-assessment && test -w /var/lib/onlinejudge-assessment"]
    volumes:
      - assessment-files:/var/lib/onlinejudge-assessment
  assessment-runtime-account-init:
    image: mysql:8.4
    depends_on:
      assessment-db: {condition: service_healthy}
    environment:
      MYSQL_ROOT_PASSWORD: root-password
    entrypoint: ["sh", "-ec"]
    command:
      - |
        export MYSQL_PWD="$$MYSQL_ROOT_PASSWORD"
        mysql --protocol=tcp --host=assessment-db --port=3306 --user=root <<'SQL'
        REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'onlinejudge_assessment'@'%';
        GRANT SELECT, INSERT, UPDATE, DELETE ON oj_assessment.* TO 'onlinejudge_assessment'@'%';
        FLUSH PRIVILEGES;
        SQL
  assessment-migrations:
    image: mysql:8.4
    depends_on:
      assessment-runtime-account-init: {condition: service_completed_successfully}
    environment:
      MYSQL_HOST: assessment-db
      MYSQL_PORT: "3306"
      MIGRATION_DATABASE_NAME: oj_assessment
      MIGRATION_DATABASE_USER: root
      MIGRATION_DATABASE_PASSWORD: root-password
      MIGRATION_ROOT: /workspace/migrations
    entrypoint: ["sh", "/workspace/migrate-service.sh", "--schema", "assessment"]
    volumes:
      - ../../database/mysql/migrate-service.sh:/workspace/migrate-service.sh:ro
      - ../../database/migrations:/workspace/migrations:ro
  assessment-api:
    build:
      context: ../..
      dockerfile: services/assessment/Dockerfile
    depends_on:
      assessment-db: {condition: service_healthy}
      assessment-storage-init: {condition: service_completed_successfully}
      assessment-migrations: {condition: service_completed_successfully}
    environment:
      ASSESSMENT_DATABASE_HOST: assessment-db
      ASSESSMENT_DATABASE_USER: onlinejudge_assessment
      ASSESSMENT_DATABASE_PASSWORD: assessment-password
      ONLINEJUDGE_DEMO_DATA_ENABLED: ${ONLINEJUDGE_DEMO_DATA_ENABLED:-true}
      ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE: ${ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE:?ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE is required}
      ASSESSMENT_IDENTITY_JWKS_URI: ${ASSESSMENT_IDENTITY_JWKS_URI:?ASSESSMENT_IDENTITY_JWKS_URI is required}
      ASSESSMENT_COURSE_AUTHORIZATION_URI: ${ASSESSMENT_COURSE_AUTHORIZATION_URI:?ASSESSMENT_COURSE_AUTHORIZATION_URI is required}
      ASSESSMENT_COURSE_SERVICE_AUTHORIZATION: ${ASSESSMENT_COURSE_SERVICE_AUTHORIZATION:?ASSESSMENT_COURSE_SERVICE_AUTHORIZATION is required}
      # The API owns its MySQL transaction and outbox.  A broker outage must
      # never prevent a submission from being accepted durably.
      ASSESSMENT_RABBIT_ENABLED: "false"
      ASSESSMENT_RABBIT_RELAY_ENABLED: "false"
      ASSESSMENT_RABBIT_EXCHANGE: onlinejudge.events.v2
      ASSESSMENT_STORAGE_ROOT: /var/lib/onlinejudge-assessment
    volumes:
      - assessment-files:/var/lib/onlinejudge-assessment
    ports: ["${ASSESSMENT_API_PORT:-18083}:8083"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
  assessment-worker:
    build:
      context: ../..
      dockerfile: services/assessment/Dockerfile
    depends_on:
      assessment-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      assessment-storage-init: {condition: service_completed_successfully}
      assessment-migrations: {condition: service_completed_successfully}
      assessment-sandbox-docker-proxy: {condition: service_started}
      assessment-sandbox-python-image-init: {condition: service_completed_successfully}
      assessment-sandbox-java-image-init: {condition: service_completed_successfully}
      assessment-sandbox-cpp-image-init: {condition: service_completed_successfully}
    environment:
      ASSESSMENT_DATABASE_HOST: assessment-db
      ASSESSMENT_DATABASE_USER: onlinejudge_assessment
      ASSESSMENT_DATABASE_PASSWORD: assessment-password
      # Only the API seeds demo data; the worker must stay read-only towards it.
      ONLINEJUDGE_DEMO_DATA_ENABLED: "false"
      ASSESSMENT_WORKER_ENABLED: "true"
      ASSESSMENT_RABBIT_ENABLED: "true"
      ASSESSMENT_RABBIT_HOST: rabbitmq
      ASSESSMENT_RABBIT_USERNAME: ${ASSESSMENT_RABBIT_USERNAME:?ASSESSMENT_RABBIT_USERNAME is required}
      ASSESSMENT_RABBIT_PASSWORD: ${ASSESSMENT_RABBIT_PASSWORD:?ASSESSMENT_RABBIT_PASSWORD is required}
      ASSESSMENT_RABBIT_EXCHANGE: onlinejudge.events.v2
      # The worker is the broker-facing delivery workload.  It relays API
      # outbox rows and runs the two durable consumers.
      ASSESSMENT_RABBIT_RELAY_ENABLED: "true"
      ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE: ${ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE:?ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE is required}
      ASSESSMENT_IDENTITY_JWKS_URI: ${ASSESSMENT_IDENTITY_JWKS_URI:?ASSESSMENT_IDENTITY_JWKS_URI is required}
      ASSESSMENT_COURSE_AUTHORIZATION_URI: ${ASSESSMENT_COURSE_AUTHORIZATION_URI:?ASSESSMENT_COURSE_AUTHORIZATION_URI is required}
      ASSESSMENT_COURSE_SERVICE_AUTHORIZATION: ${ASSESSMENT_COURSE_SERVICE_AUTHORIZATION:?ASSESSMENT_COURSE_SERVICE_AUTHORIZATION is required}
      ASSESSMENT_STORAGE_ROOT: /var/lib/onlinejudge-assessment
      ASSESSMENT_SANDBOX_DOCKER_API_URI: http://assessment-sandbox-docker-proxy:2375
      ASSESSMENT_SANDBOX_IMAGE: python:3.12-alpine
      ASSESSMENT_SANDBOX_JAVA_IMAGE: eclipse-temurin:21-jdk-alpine
      ASSESSMENT_SANDBOX_CPP_IMAGE: gcc:14.2.0
      ASSESSMENT_WORKER_LEASE: ${ASSESSMENT_WORKER_LEASE:-PT30S}
      ASSESSMENT_WORKER_HEARTBEAT_INTERVAL: ${ASSESSMENT_WORKER_HEARTBEAT_INTERVAL:-PT5S}
      ASSESSMENT_WORKER_MAX_ATTEMPTS: ${ASSESSMENT_WORKER_MAX_ATTEMPTS:-3}
      ASSESSMENT_WORKER_RETRY_BACKOFF: ${ASSESSMENT_WORKER_RETRY_BACKOFF:-PT5S}
    volumes:
      - assessment-files:/var/lib/onlinejudge-assessment
    command: ["--spring.main.web-application-type=none", "--assessment.worker.enabled=true"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/assessment-worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  assessment-files:
