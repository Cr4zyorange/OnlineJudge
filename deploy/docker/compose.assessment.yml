name: onlinejudge-assessment
services:
  assessment-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: oj_assessment
      MYSQL_USER: onlinejudge_assessment
      MYSQL_PASSWORD: assessment-password
      MYSQL_ROOT_PASSWORD: root-password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 24
  rabbitmq:
    image: rabbitmq:4.1-management
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 24
  assessment-storage-init:
    image: mysql:8.4
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /var/lib/onlinejudge-assessment && chown -R 10003:10003 /var/lib/onlinejudge-assessment && test -w /var/lib/onlinejudge-assessment"]
    volumes:
      - assessment-files:/var/lib/onlinejudge-assessment
  assessment-api:
    build:
      context: ../..
      dockerfile: services/assessment/Dockerfile
    depends_on:
      assessment-db: {condition: service_healthy}
      assessment-storage-init: {condition: service_completed_successfully}
    environment:
      ASSESSMENT_DATABASE_HOST: assessment-db
      ASSESSMENT_DATABASE_PASSWORD: assessment-password
      ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE: ${ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE:?ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE is required}
      ASSESSMENT_IDENTITY_JWKS_URI: ${ASSESSMENT_IDENTITY_JWKS_URI:?ASSESSMENT_IDENTITY_JWKS_URI is required}
      # The API owns its MySQL transaction and outbox.  A broker outage must
      # never prevent a submission from being accepted durably.
      ASSESSMENT_RABBIT_ENABLED: "false"
      ASSESSMENT_RABBIT_RELAY_ENABLED: "false"
      ASSESSMENT_STORAGE_ROOT: /var/lib/onlinejudge-assessment
    volumes:
      - assessment-files:/var/lib/onlinejudge-assessment
    ports: ["18083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
  assessment-worker:
    build:
      context: ../..
      dockerfile: services/assessment/Dockerfile
    depends_on:
      assessment-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      assessment-storage-init: {condition: service_completed_successfully}
    environment:
      ASSESSMENT_DATABASE_HOST: assessment-db
      ASSESSMENT_DATABASE_PASSWORD: assessment-password
      ASSESSMENT_WORKER_ENABLED: "true"
      ASSESSMENT_RABBIT_ENABLED: "true"
      ASSESSMENT_RABBIT_HOST: rabbitmq
      # The worker is the broker-facing delivery workload.  It relays API
      # outbox rows and runs the two durable consumers.
      ASSESSMENT_RABBIT_RELAY_ENABLED: "true"
      ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE: ${ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE:?ASSESSMENT_IDENTITY_JWKS_TRUST_BUNDLE is required}
      ASSESSMENT_IDENTITY_JWKS_URI: ${ASSESSMENT_IDENTITY_JWKS_URI:?ASSESSMENT_IDENTITY_JWKS_URI is required}
      ASSESSMENT_STORAGE_ROOT: /var/lib/onlinejudge-assessment
      ASSESSMENT_SANDBOX_COMMAND: ${ASSESSMENT_SANDBOX_COMMAND:?ASSESSMENT_SANDBOX_COMMAND is required}
      ASSESSMENT_SANDBOX_PRE_EXECUTION_DELAY: ${ASSESSMENT_SANDBOX_PRE_EXECUTION_DELAY:-PT0S}
      ASSESSMENT_WORKER_LEASE: ${ASSESSMENT_WORKER_LEASE:-PT30S}
      ASSESSMENT_WORKER_HEARTBEAT_INTERVAL: ${ASSESSMENT_WORKER_HEARTBEAT_INTERVAL:-PT5S}
      ASSESSMENT_WORKER_MAX_ATTEMPTS: ${ASSESSMENT_WORKER_MAX_ATTEMPTS:-3}
      ASSESSMENT_WORKER_RETRY_BACKOFF: ${ASSESSMENT_WORKER_RETRY_BACKOFF:-PT5S}
    volumes:
      - assessment-files:/var/lib/onlinejudge-assessment
    command: ["--spring.main.web-application-type=none", "--assessment.worker.enabled=true"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/assessment-worker-ready"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  assessment-files:
