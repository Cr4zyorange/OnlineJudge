name: onlinejudge

services:
  mysql:
    image: mysql:8.4
    container_name: onlinejudge-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-onlinejudge}
      MYSQL_USER: ${MYSQL_USER:-onlinejudge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-onlinejudge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: onlinejudge-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-onlinejudge}
      MYSQL_USER: ${MYSQL_USER:-onlinejudge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-onlinejudge}
      ONLINEJUDGE_DEMO_DATA_ENABLED: ${ONLINEJUDGE_DEMO_DATA_ENABLED:-true}
      ONLINEJUDGE_EVALUATION_SANDBOX_MODE: ${ONLINEJUDGE_EVALUATION_SANDBOX_MODE:-fake}
      ONLINEJUDGE_NOTIFICATIONS_INTERNAL_TOKEN: ${ONLINEJUDGE_NOTIFICATIONS_INTERNAL_TOKEN:-}
    volumes:
      - app-data:/opt/onlinejudge/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/system/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    container_name: onlinejudge-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${OJ_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<!doctype html>'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql-data:
  app-data:
