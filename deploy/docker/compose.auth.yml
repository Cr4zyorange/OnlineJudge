name: onlinejudge-auth

services:
  auth-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: onlinejudge_auth
      MYSQL_USER: ${AUTH_DB_USER:-onlinejudge_auth}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:?AUTH_DB_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - auth-mysql-data:/var/lib/mysql
      - ../../services/auth-service/src/main/resources/db/migration/DB-AUTH-01-auth-user-session.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  auth-service:
    image: onlinejudge/auth-service:${GIT_SHA:?GIT_SHA must be the current full 40-character commit SHA}
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 3306
      AUTH_DB_NAME: onlinejudge_auth
      AUTH_DB_USER: ${AUTH_DB_USER:-onlinejudge_auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      AUTH_SEED_DATA_ENABLED: ${AUTH_SEED_DATA_ENABLED:-false}
      AUTH_SERVICE_REVISION: ${GIT_SHA:?GIT_SHA must be the current full 40-character commit SHA}
    ports:
      - "${AUTH_HTTP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/system/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  auth-mysql-data:
