server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_intercept_errors on;
    error_page 502 = @gateway_bad_gateway;
    error_page 504 = @gateway_gateway_timeout;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Username "";
    proxy_set_header X-User-Role "";
    proxy_set_header X-Permissions "";
    proxy_set_header X-Course-Ids "";
    proxy_set_header X-Manageable-Course-Ids "";

    location ~ ^/api/v1/courses/[0-9]+/(labs|homeworks)(/|$) {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8080;
    }

    location ~ ^/api/v1/courses/[0-9]+/(grades|grade-items|grade-analysis|grade-review-requests|my-grades)(/|$) {
        proxy_pass http://backend:8080;
    }

    location ^~ /api/v1/auth/ { proxy_pass http://backend:8080; }
    location ^~ /api/v1/users/me { proxy_pass http://backend:8080; }
    location ^~ /api/v1/admin/ { proxy_pass http://backend:8080; }
    location ^~ /api/v1/labs/ { proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://backend:8080; }
    location ^~ /api/v1/homeworks/ { proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://backend:8080; }
    location ^~ /api/v1/submissions/ { proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://backend:8080; }
    location ^~ /api/v1/evaluations/ { proxy_pass http://backend:8080; }
    location ^~ /api/v1/learning/ { proxy_pass http://backend:8080; }
    location ^~ /api/v1/notifications/ { proxy_pass http://backend:8080; }
    location ^~ /api/v1/reminder-rules/ { proxy_pass http://backend:8080; }
    location ^~ /api/v1/chapters/ { proxy_pass http://backend:8080; }
    location /api/v1/courses/ { proxy_pass http://backend:8080; }
    location /api/ { proxy_pass http://backend:8080; }

    location / {
        try_files $uri /index.html;
    }

    location @gateway_bad_gateway {
        default_type application/json;
        return 502 '{"code":"GATEWAY_502","message":"下游服务暂不可用","data":null}';
    }

    location @gateway_gateway_timeout {
        default_type application/json;
        return 504 '{"code":"GATEWAY_504","message":"下游服务响应超时","data":null}';
    }
}
